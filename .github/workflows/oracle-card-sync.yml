name: Sync Oracle Card Data

on:
  schedule:
    # Deliberately hours after the daily 03:20 card-price sync, not the 85
    # minutes this used to leave. That sync rewrites card_prices and card_prints
    # wholesale, and the autovacuum it triggers has a history of pushing
    # unrelated statements past their timeout.
    - cron: '15 7 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_oracle_cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync oracle card metadata
        run: npm run sync:oracle-cards
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
