name: Sync Price History

on:
  schedule:
    # After the 03:20 card-price sync and its autovacuum settle, and comfortably
    # after MTGJSON's own build (kicks off 01:00 EST, live 09:00 EST = 14:00 UTC).
    # Running before their build lands would just re-ingest yesterday's window.
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_price_history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync price history
        run: npm run sync:price-history
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
