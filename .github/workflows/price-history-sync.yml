name: Sync Price History

on:
  schedule:
    # After the 03:20 card-price sync and its autovacuum settle, and comfortably
    # after MTGJSON's own build (kicks off 01:00 EST, live 09:00 EST = 14:00 UTC).
    # Running before their build lands would just re-ingest yesterday's window.
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_price_history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # AllIdentifiers is 219 MB of the ~362 MB this job moves, and it exists
      # only to resolve MTGJSON uuids to Scryfall ids — a mapping that changes
      # only when printings are added. The derived pairs (~9 MB of TSV) are
      # cached instead, so most runs skip that download entirely.
      #
      # A unique key with a shared restore-keys prefix is the always-save
      # pattern: every run restores the newest map and writes back whatever it
      # ended up with. Freshness is not on a timer — the script counts how many
      # printings the cached map fails to resolve and re-downloads
      # AllIdentifiers when that crosses a threshold (a new set release), so a
      # stale cache costs one download, never coverage.
      - name: Restore MTGJSON id map
        uses: actions/cache@v6
        with:
          path: .cache/mtgjson-scryfall-ids.tsv
          key: mtgjson-ids-v1-${{ github.run_id }}
          restore-keys: mtgjson-ids-v1-

      - name: Sync price history
        run: npm run sync:price-history
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
